<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — TORICELI</title><link rel="stylesheet" href="/style.css"></head><body class="admin"><header class="nav"><a class="brand" href="/">TORICELI<span>.</span></a><a href="/">← Magazin</a></header><main class="adminwrap"><div class="eyebrow">PANOU DE CONTROL</div><h1>Administrare<span>.</span></h1><section id="loginBox" class="panel"><h2>Autentificare</h2><input id="password" type="password" placeholder="Parola de administrator"><button class="btn" id="login">Intră în cont</button><p id="loginMsg" class="fine"></p></section><section id="dashboard" class="panel" hidden><h2>Produsul tău</h2><label>Nume produs<input id="pname"></label><label>Preț (RON)<input id="pprice" type="number" min="0" step="0.01"></label><label>Descriere<textarea id="pdesc"></textarea></label><label>Adresă imagine (URL, opțional)<input id="pimage" placeholder="https://..."></label><label class="check"><input id="active" type="checkbox"> Publică produsul în magazin</label><button class="btn" id="save">Salvează produsul</button><button class="secondary" id="logout">Deconectare</button><p id="saveMsg" class="fine"></p><hr><h2>Comenzi de test</h2><div id="orders">Nu există comenzi.</div></section></main><script src="/admin.js"></script></body></html>
